<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe — The Missing Financial Primitive</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #0a0a0a;
    pointer-events: none;
  }
  .poster-gate {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    transition: opacity 320ms ease;
  }
  .poster-gate img {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
  }
  .poster-gate.is-hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
<template id="__bundler_thumbnail" data-bg-color="#f3f3f6">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f3f3f6"></rect>
    <circle cx="600" cy="370" r="130" fill="#2B5CE6"></circle>
    <path d="M 560 310 L 560 430 L 670 370 Z" fill="#ffffff"></path>
    <rect x="480" y="560" width="240" height="16" rx="8" fill="#2B5CE6"></rect>
  </svg>
</template>
</head>
<body>
<div class="poster-gate" aria-hidden="true">
  <img src="assets/images/the-credit-layer-thumbnail.png" alt="">
</div>
<video playsinline muted preload="auto" poster="assets/images/the-credit-layer-thumbnail.png">
  <source src="assets/video/vibe-explainer.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>
<script>
  const video = document.querySelector('video');
  const posterGate = document.querySelector('.poster-gate');
  const params = new URLSearchParams(window.location.search);
  const volume = Number.parseFloat(params.get('volume'));
  const embedded = params.get('embed') === '1';
  if (Number.isFinite(volume)) {
    video.volume = Math.max(0, Math.min(1, volume / 100));
    if (video.volume > 0) video.muted = false;
  }
  if (embedded) {
    video.addEventListener('ended', () => {
      try { window.parent.postMessage({ type: 'vibe-explainer-ended' }, '*'); } catch {}
    }, { once: true });
  }
  setTimeout(() => {
    posterGate.classList.add('is-hidden');
    video.style.pointerEvents = 'auto';
    video.controls = !embedded;
    video.play().catch(() => {});
    setTimeout(() => posterGate.remove(), 400);
  }, 3000);
</script>
</body>
</html>
