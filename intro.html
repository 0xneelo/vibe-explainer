<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>Vibe — Intro Drawing (surgical edit)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Just+Another+Hand&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"></link>
<meta name="ext-resource-dependency" content="assets/images/vibe-duck.svg" data-resource-id="vibeDuck"></meta>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; }
  #root { position: absolute; inset: 0; }
</style>
<template id="__bundler_thumbnail" data-bg-color="#f3f3f6">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f3f3f6"></rect>
    <rect x="500" y="240" width="200" height="340" rx="36" fill="#ffffff" stroke="#1c1e2a" stroke-width="10"></rect>
    <circle cx="600" cy="350" r="52" fill="#2B5CE6"></circle>
    <rect x="540" y="450" width="120" height="36" rx="12" fill="#2B5CE6"></rect>
  </svg>
</template>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Local JSX is compiled in-browser by Babel, so a plain HTTP server (and the
     deployed CDN) will otherwise serve a STALE cached build after an edit. Each
     file is loaded with a version query: on localhost / LAN it auto-busts every
     reload (edits always show up); on the deployed site it stays cached until
     VIBE_SRC_VERSION is bumped, forcing every visitor to re-fetch. -->
<script>
  (function () {
    var h = location.hostname;
    var isDev = h === 'localhost' || h === '127.0.0.1' || h === ''
      || /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
    window.VIBE_SRC_VERSION = isDev ? String(Date.now()) : '20260615-1';
    var srcs = [
      'src/core/animations.jsx',
      'src/core/vibe-elements.jsx',
      'src/core/vibe-slide-text.jsx',
      'src/scenes/vibe-scenes-a.jsx',
      'src/scenes/vibe-scene-intro.jsx',
      'src/apps/vibe-intro-app.jsx'
    ];
    for (var i = 0; i < srcs.length; i++) {
      document.write('<script type="text/babel" src="' + srcs[i]
        + '?v=' + window.VIBE_SRC_VERSION + '"><\/script>');
    }
  })();
</script>
</body>
</html>
