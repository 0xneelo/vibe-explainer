<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Local JSX is compiled in-browser by Babel, so a plain HTTP server (and the
     deployed CDN) will otherwise serve a STALE cached build after an edit. Each
     file is loaded with a version query: on localhost / LAN it auto-busts every
     reload (edits always show up); on the deployed site it stays cached until
     VIBE_SRC_VERSION is bumped, forcing every visitor to re-fetch. -->
<script>
  (function () {
    var h = location.hostname;
    var isDev = h === 'localhost' || h === '127.0.0.1' || h === ''
      || /^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
    window.VIBE_SRC_VERSION = isDev ? String(Date.now()) : '20260615-1';
    var srcs = [
      'src/core/animations.jsx',
      'src/core/tweaks-panel.jsx',
      'src/core/vibe-elements.jsx',
      'src/core/vibe-slide-text.jsx',
      'src/scenes/vibe-scene-intro.jsx',
      'src/scenes/vibe-scenes-a.jsx',
      'src/scenes/vibe-scenes-b.jsx',
      'src/scenes/vibe-scenes-c.jsx',
      'src/audio/vibe-music.jsx',
      'src/audio/vibe-elevenlabs.jsx',
      'src/export/vibe-clips-zip.jsx',
      'src/core/vibe-preload.jsx',
      'src/core/vibe-render.jsx',
      'src/audio/vibe-narration-file.jsx',
      'src/export/vibe-export-audio.jsx',
      'src/core/vibe-transcript.jsx',
      'src/export/vibe-record.jsx',
      'src/apps/vibe-app.jsx'
    ];
    for (var i = 0; i < srcs.length; i++) {
      document.write('<script type="text/babel" src="' + srcs[i]
        + '?v=' + window.VIBE_SRC_VERSION + '"><\/script>');
    }
  })();
</script>
</body>
